<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件上传测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px;
      width: 480px;
      max-width: 100%;
    }
    h2 { text-align: center; margin-bottom: 24px; color: #1a1a1a; }
    .drop-zone {
      border: 2px dashed #d9d9d9;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .3s, background .3s;
      margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #1677ff;
      background: #f0f5ff;
    }
    .drop-zone p { color: #999; font-size: 14px; }
    .drop-zone .icon { font-size: 40px; margin-bottom: 8px; }
    input[type="file"] { display: none; }
    .file-info {
      background: #fafafa;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #555;
      word-break: break-all;
    }
    .file-info strong { color: #333; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1677ff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .3s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
    }
    .result.success { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    .result.error { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
    .loading { text-align: center; color: #1677ff; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>文件上传测试</h2>

    <div class="drop-zone" id="dropZone">
      <div class="icon">📁</div>
      <p>点击或拖拽文件到此处</p>
    </div>
    <input type="file" id="fileInput" />

    <div class="file-info" id="fileInfo" style="display:none">
      <div><strong>文件名：</strong><span id="fileName"></span></div>
      <div><strong>大小：</strong><span id="fileSize"></span></div>
      <div><strong>类型：</strong><span id="fileType"></span></div>
    </div>

    <button id="uploadBtn" disabled>上传</button>

    <div class="loading" id="loading">上传中...</div>
    <div class="result" id="result" style="display:none"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const fileType = document.getElementById('fileType');
    const uploadBtn = document.getElementById('uploadBtn');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');

    let selectedFile = null;

    function showFile(file) {
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
      fileType.textContent = file.type || '未知';
      fileInfo.style.display = 'block';
      uploadBtn.disabled = false;
      result.style.display = 'none';
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) showFile(file);
    });
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) showFile(file);
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append('file', selectedFile);

      uploadBtn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';

      try {
        const res = await fetch('/oss/upload', { method: 'POST', body: formData });
        const data = await res.json();
        result.className = 'result success';
        result.innerHTML = [
          '<strong>上传成功！</strong>',
          'ID: ' + data.id,
          '文件名: ' + data.fileName,
          '类型: ' + data.fileType,
          '访问链接: <a href="' + data.url + '" target="_blank">' + data.url + '</a>',
          '上传时间: ' + data.createdAt,
        ].join('<br>');
      } catch (err) {
        result.className = 'result error';
        result.textContent = '上传失败: ' + err.message;
      } finally {
        result.style.display = 'block';
        loading.style.display = 'none';
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
