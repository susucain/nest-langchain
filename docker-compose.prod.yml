version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: langchain-prod-mysql
    # 生产环境：不暴露端口到宿主机（只在内部网络访问）
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: hello
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - /opt/nest-langchain/volumes/mysql:/var/lib/mysql
    restart: always
    networks:
      - langchain-network

  nest-app:
    container_name: langchain-prod-nest-app
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"  # 只暴露应用端口
    env_file:
      - /etc/secrets/env.prod
    environment:
      NODE_ENV: production
      DB_HOST: mysql  # 使用服务名访问
    depends_on:
      - mysql
    restart: always
    networks:
      - langchain-network

  etcd:
    container_name: langchain-prod-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /opt/nest-langchain/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - langchain-network

  minio:
    container_name: langchain-prod-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - /opt/nest-langchain/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - langchain-network

  standalone:
    container_name: langchain-prod-standalone
    image: milvusdb/milvus:v2.6.17
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - /opt/nest-langchain/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    restart: always
    networks:
      - langchain-network

networks:
  langchain-network:
    driver: bridge
    name: langchain-prod-network
