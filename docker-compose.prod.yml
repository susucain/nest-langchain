version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: langchain-prod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: hello
      MYSQL_INITDB_SKIP_TZINFO: '1'
    command: 
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=64M
      - --innodb_flush_log_at_trx_commit=2
      - --query_cache_type=1
      - --query_cache_size=64M
      - --max_connections=100
      - --wait_timeout=60
      - --interactive_timeout=60
    volumes:
      - /opt/nest-langchain/volumes/mysql:/var/lib/mysql
    restart: always
    networks:
      - langchain-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  nest-app:
    container_name: langchain-prod-nest-app
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    env_file:
      - /etc/secrets/env.prod
    environment:
      NODE_ENV: production
      DB_HOST: langchain-prod-mysql
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      - mysql
    restart: always
    networks:
      - langchain-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  langchain-network:
    driver: bridge
    name: langchain-prod-network
